name: Keep Backend Alive

on:
  schedule:
    # Every 10 minutes. Render's free-tier spin-down window is ~15 min of
    # inactivity, so this stays comfortably under it.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ secrets.BACKEND_HEALTH_URL }}"
          if [ -z "$url" ]; then
            echo "BACKEND_HEALTH_URL secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
          echo "Response: $status"

          if [ "$status" -ne 200 ]; then
            echo "::warning::Health check returned $status instead of 200"
            exit 1
          fi
